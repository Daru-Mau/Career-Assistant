<!DOCTYPE html>
<html lang="{{ LANG }}">
<head>
<meta charset="utf-8">
<title>{{ NAME }} — CV</title>
<style>
  @page { size: A4; margin: 16mm 16mm 14mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
    font-size: 8.6pt;
    line-height: 1.28;
    color: #1a1a1a;
  }
  header { text-align: center; margin-bottom: 5pt; }
  h1 { font-size: 20pt; letter-spacing: 0.5pt; font-weight: 700; }
  .contact { font-size: 9pt; color: #333; margin-top: 2pt; }
  .contact span + span::before { content: "  •  "; color: #888; }
  .links { font-size: 8.8pt; color: #333; margin-top: 1.5pt; }
  .links span + span::before { content: "  •  "; color: #888; }
  h2 {
    font-size: 9pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5pt;
    border-bottom: 0.5pt solid #1a1a1a;
    padding-bottom: 1pt;
    margin: 6pt 0 2.5pt;
  }
  .summary { text-align: justify; }
  .entry { margin: 2.5pt 0; page-break-inside: avoid; }
  .entry-head { display: flex; justify-content: space-between; align-items: baseline; }
  .entry-head .title { font-weight: 700; }
  .entry-head .date { font-weight: 400; color: #444; white-space: nowrap; padding-left: 8pt; }
  .entry .sub { font-weight: 700; font-style: italic; margin: 0.5pt 0; }
  ul { list-style: disc; padding-left: 12pt; margin: 1pt 0; }
  li { margin: 0.6pt 0; }
  .key-skills { font-size: 7.8pt; margin: 0.5pt 0 1pt; }
  .skills-cols { column-count: 2; column-gap: 16pt; }
  .skill-group { page-break-inside: avoid; margin-bottom: 2pt; }
  .skill-group b { display: inline; }
  ul.certs { list-style: none; padding-left: 0; }
  ul.certs li { margin: 0.6pt 0; }
  ul.lang { list-style: none; padding-left: 0; }
  ul.lang li { margin: 0.6pt 0; }
</style>
</head>
<body>

<header>
  <h1>{{ NAME }}</h1>
  <div class="contact">
    <span>{{ EMAIL }}</span>
    <span>{{ PHONE }}</span>
    <span>{{ LOCATION }}</span>
  </div>
  <div class="links">
    <span>{{ LINKEDIN }}</span>
    <span>{{ GITHUB }}</span>
  </div>
</header>

<section class="summary">
  <h2>{{ SUMMARY_HEADER }}</h2>
  {{ SUMMARY }}
</section>

<section class="projects">
  <h2>{{ PROJECTS_HEADER }}</h2>
  {{ PROJECTS }}
</section>

{{ WORK_EXPERIENCE }}

<section class="skills">
  <h2>{{ SKILLS_HEADER }}</h2>
  <div class="skills-cols">{{ SKILLS }}</div>
</section>

{{ EDUCATION }}

{{ CERTIFICATIONS }}

{{ EXTRAS }}

</body>
</html>
